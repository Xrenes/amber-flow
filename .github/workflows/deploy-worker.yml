name: Deploy Cloudflare Worker

# Same job the old repo ran on every push to master, now pointed at the
# Worker's folder in this monorepo (amber-flow-master/) and only run when
# the Worker itself changes, so web/desktop/mobile pushes don't redeploy it.
on:
  push:
    branches: [master]
    paths:
      - 'amber-flow-master/worker.js'
      - 'amber-flow-master/wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amber-flow-master
    steps:
      # The repo has no CF_API_TOKEN secret yet (the Worker has been deployed
      # by hand). Skip cleanly instead of failing until one is added under
      # Settings → Secrets and variables → Actions (CF_API_TOKEN, INTERNAL_USERS).
      - name: Check Cloudflare token
        id: token
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        working-directory: .
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::notice::CF_API_TOKEN secret not set — skipping Worker deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - name: Set INTERNAL_USERS secret
        if: steps.token.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          echo '${{ secrets.INTERNAL_USERS }}' | npx wrangler secret put INTERNAL_USERS --name amber-worker

      - name: Deploy to Cloudflare Workers
        if: steps.token.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: e1daac85375e898cbd8933c9757a032b
          workingDirectory: amber-flow-master
